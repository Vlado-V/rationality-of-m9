  notes: The development used coordinated Codex agent work and explicit source/object/receipt bindings.
    Material model, framework and tool roles are credited here; author and maintainer responsibility is
    assigned to the named human.
fidelity:
  divergences: The coarse moduli object is represented as an ordinary fppf algebraic space with its full
    original-family classifier and all-algebraic-space categorical universal property. Rationality is
    witnessed by a common nonempty dense open with affine 24-space over the literal complex field; the
    same chosen space has a structural C-algebra function-field equivalence. The statement is the fixed-complex-field
    endpoint, without an additional generic-universe or global scheme-representability assertion. The
    numbered omissions and replacement arguments are documented in LEAN_ERRATA.md.
