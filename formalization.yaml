version: v0.4
project:
  name: Rationality of the moduli space of curves of genus nine
  description: 'Formalization of Theorem 1.1 of Rationality of the Moduli Space of Curves of Genus Nine:
    the coarse moduli space of smooth, connected, unpointed complex curves of genus nine is rational over
    C. The proof constructs a classifier on all original scheme bases and curve families, proves its categorical
    and geometric coarse-moduli properties, and gives a dense rational open of dimension 24 together with
    a coefficient-preserving identification of the same chosen space''s structural function field with
    C(t1,...,t24).'
  authors:
  - Vlado Vojdanovski
  license: Apache-2.0
  responsible_maintainers:
  - Vlado Vojdanovski
