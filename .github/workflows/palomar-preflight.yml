name: Palomar full preflight
run-name: Palomar full preflight ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Exactly 12 lowercase alphanumeric characters
        required: true
        type: string
      execution_profile:
        description: Palomar verification profile
        required: true
        type: choice
        default: palomar-standard-v1
        options:
          - palomar-standard-v1
          - palomar-namespace-32x64-v1

permissions:
  contents: read

jobs:
  verify:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: ${{ inputs.request_id }}
      mode: full
      execution_profile: ${{ inputs.execution_profile }}
      options: >-
        {"comparator_config_path":"comparator.json","authorization_relationship":"I have approval from a responsible author or maintainer"}
